services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gulmi_erp}
      POSTGRES_USER: ${POSTGRES_USER:-gulmi_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gulmi_erp}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gulmi_erp} -d ${POSTGRES_DB:-gulmi_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      POSTGRES_DB: ${POSTGRES_DB:-gulmi_erp}
      POSTGRES_USER: ${POSTGRES_USER:-gulmi_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gulmi_erp}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_VERSION: ${APP_VERSION:-0.2.0-sprint1}
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
